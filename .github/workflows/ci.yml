name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: serveloop --version
      - run: serveloop capabilities
      - run: python -B tests/test_serveloop.py
      - run: python -B tests/test_windows.py
      - run: python -B tests/test_session_compatibility.py
      - name: Enhanced coarse trace contracts
        run: |
          python -B -m unittest discover -s tests -p "test_coarse_*.py"
          python -B tests/test_model_structure.py
          python -B -m unittest discover -s tests -p "test_resolved_geometry_optional.py"
