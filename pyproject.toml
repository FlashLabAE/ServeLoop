[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serveloop"
version = "0.2.0a1"
description = "LLM serving and fixed-window memory workload frontend for HBFSim"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["llm", "serving", "workload", "memory", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.scripts]
serveloop = "serveloop.__main__:main"

[project.urls]
Repository = "https://github.com/Systems-and-Memory-Lab/ServeLoop"
Issues = "https://github.com/Systems-and-Memory-Lab/ServeLoop/issues"

[tool.setuptools.packages.find]
include = ["serveloop*", "hbfsim_client*"]
exclude = ["tests*"]
